<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Minded</title>
<meta name="description" content="A simple tracker for income, expenses and savings.">
<meta name="theme-color" content="#1E2A20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Money Minded">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preload" as="image" href="assets/piggy.webp">
<link rel="preload" as="font" type="font/woff" href="assets/fonts/poppins-medium.woff" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Poppins';src:url(assets/fonts/poppins-regular.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Poppins';src:url(assets/fonts/poppins-medium.woff) format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Poppins';src:url(assets/fonts/poppins-bold.woff) format('woff');font-weight:600 700;font-display:swap}
@font-face{font-family:'Lora';src:url(assets/fonts/lora.woff) format('woff');font-weight:400 700;font-display:swap}
@font-face{font-family:'Lora';src:url(assets/fonts/lora-italic.woff) format('woff');font-weight:400 700;font-style:italic;font-display:swap}
:root{
  /* greens + linen (the palette so far) */
  --forest:#1E2A20; --card:#263528; --card-2:#2F4032; --field:#1A241C;
  --linen:#D5C4A1; --cream:#F3E9D3; --paper:#EFE3C7;
  --ink:#EFE6D2; --ink-2:#BDB9A3; --ink-3:#8F9682;
  /* maroons */
  --maroon:#5C1B28; --maroon-2:#6E2433; --maroon-deep:#3D0E18; --maroon-ink:#5A1A27;
  --income:#A9C7AF; --expense:#E6A5A8; --saving:#E2C98C; --neg:#F0A497;
  --line:rgba(213,196,161,.12);
  --r-lg:26px; --r-md:20px; --r-sm:16px;
  --sans:'Poppins','Avenir Next','Segoe UI',system-ui,sans-serif;
  --serif:'DM Serif Display','Lora',Georgia,serif;
  --script:'Pinyon Script','Lora',cursive;
  --grain:url(assets/grain.png);
  --velvet:radial-gradient(130% 100% at 20% 0%,#73283A 0%,#56192A 48%,#3F0F1B 100%);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;background:var(--forest)}
body{font-family:var(--sans);color:var(--ink);min-height:100dvh;font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--linen);outline-offset:3px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.script{font-family:var(--script);font-weight:400;letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- backdrop: forest green with a faint harlequin + paper grain ---------- */
.bg{position:fixed;inset:0;z-index:-3;overflow:hidden;background:var(--forest)}
.bg::before{content:"";position:absolute;inset:-60%;transform:rotate(45deg);opacity:.55;
  background:conic-gradient(#223125 25%,transparent 0 50%,#223125 0 75%,transparent 0) 0 0/64px 64px,#1E2A20}
.bg::after{content:"";position:absolute;inset:0;background:var(--grain),radial-gradient(90% 60% at 50% 20%,rgba(40,58,42,.55),transparent 70%)}
.piggy{position:fixed;z-index:-2;pointer-events:none;aspect-ratio:862/883;background:url(assets/piggy.webp) center/contain no-repeat;
  width:min(70vmin,540px);right:-9vmin;bottom:-6vmin;opacity:.2;transform:rotate(-8deg);
  transition:right .9s cubic-bezier(.2,.8,.2,1),bottom .9s cubic-bezier(.2,.8,.2,1),width .9s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s ease}
@media (min-width:1000px){.piggy{width:min(42vmin,calc(50vw - 340px));right:-3vmin;bottom:-4vmin;opacity:.16}
  body.is-wide .piggy{width:max(0px,min(42vmin,calc(50vw - 600px)))}}
body.is-landing .piggy{right:50%;bottom:calc(var(--safe-b) + 8vh + 76px);width:max(120px,min(60vmin,430px,calc(82vh - 330px)));transform:translateX(50%);opacity:1;animation:bob 5s ease-in-out 1s infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}

/* little reusable textures */
.velvet{position:relative;background:var(--grain),var(--velvet);color:var(--cream)}
.paper{background:var(--grain),var(--paper);color:var(--maroon-ink)}
.stitch::before{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(243,233,211,.32);border-radius:calc(var(--r-lg) - 7px);pointer-events:none}
.tape{position:absolute;top:-11px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-3deg);opacity:.92;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px),#D5C4A1;
  -webkit-mask:conic-gradient(from -45deg at left,#0000 25%,#000 0) left/51% 8px repeat-y,conic-gradient(from 135deg at right,#0000 25%,#000 0) right/51% 8px repeat-y;
  mask:conic-gradient(from -45deg at left,#0000 25%,#000 0) left/51% 8px repeat-y,conic-gradient(from 135deg at right,#0000 25%,#000 0) right/51% 8px repeat-y}

/* ---------- landing ---------- */
.landing{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;text-align:center;
  padding:calc(var(--safe-t) + 10vh) 24px calc(var(--safe-b) + 8vh);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
body:not(.is-landing) .landing{opacity:0;pointer-events:none;transform:translateY(-4vh)}
.wordmark{line-height:1;color:var(--cream)}
.wordmark .w1{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(58px,17vw,104px);letter-spacing:-.01em}
.wordmark .w2{display:block;font-family:var(--script);font-weight:400;font-size:clamp(52px,15vw,92px);color:#E9B5B6;margin-top:-.28em;transform:rotate(-4deg)}
.landing .tag{margin-top:12px;color:var(--ink-2);font-size:15.5px}
.landing .btn{grid-row:3}

/* ---------- buttons ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;font-size:16px;font-weight:500;text-decoration:none;transition:transform .15s ease,background .2s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{color:var(--cream);background:var(--maroon-2)}
.btn.primary::after{content:"";position:absolute;inset:4px;border:1.3px dashed rgba(243,233,211,.4);border-radius:999px;pointer-events:none}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{color:var(--ink);background:var(--card-2)}
.btn.ghost:hover{background:#364a3a}
.btn.danger{color:var(--neg);min-height:46px}
.btn.block{width:100%}
.btn.big{min-height:58px;padding:0 46px;font-size:17px}
.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gbtn{background:#fff!important;color:#2b2b2b!important}.gbtn::after{display:none}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(var(--safe-t) + 10px) max(16px,calc((100vw - 1120px)/2)) 10px;background:rgba(30,42,32,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
body.is-landing .topbar,body.is-landing main{display:none}
.brand{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-size:21px;text-decoration:none;color:var(--cream);white-space:nowrap}
.brand img{width:30px;height:30px;object-fit:contain}
.nav{display:flex;gap:2px}
.nav a{color:var(--ink-2);text-decoration:none;padding:7px 12px;border-radius:999px;font-size:14px;font-weight:500}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{color:var(--cream);background:var(--maroon-2)}

/* ---------- layout + cards ---------- */
main{display:block;min-height:calc(100dvh - 60px)}
.wrap{overflow-x:clip;width:100%;max-width:580px;margin:0 auto;padding:16px 18px calc(48px + var(--safe-b))}
.wrap.wide{max-width:1120px}
.glaze{position:relative;background:var(--grain),var(--card);border-radius:var(--r-lg)}
.view-in{animation:viewin .3s ease}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h-display{font-family:var(--serif);font-weight:400;font-size:clamp(36px,9vw,46px);line-height:1;color:var(--cream)}
.h-display .script{font-size:.9em;color:#E9B5B6;margin-right:.08em}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

/* ---------- sticker icons ---------- */
.ico{--t:#F2D58F;position:relative;flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:var(--cream);color:var(--maroon-ink)}
.ico svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:var(--t)}
.ico.sm{width:36px;height:36px;border-radius:12px}.ico.sm svg{width:21px;height:21px}
.ico.lg{width:58px;height:58px;border-radius:19px}.ico.lg svg{width:33px;height:33px}
.ico.ghost{background:transparent;border:1.5px dashed rgba(213,196,161,.4);color:var(--ink-2)}

/* ---------- home ---------- */
.today{padding:6px 2px 16px}
.today .greet{font-family:var(--script);font-size:30px;line-height:1.1;color:#E9B5B6}
.today .date{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8.4vw,38px);line-height:1.08;color:var(--cream)}
.balance{position:relative;padding:26px 22px 20px;border-radius:var(--r-lg);margin-top:6px}
.balance .lbl{font-size:14px;color:rgba(243,233,211,.78)}
.balance .big{font-family:var(--serif);font-size:clamp(46px,13vw,60px);line-height:1.05;margin:2px 0 16px;color:var(--cream)}
.neg{color:var(--neg)!important}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio>div{padding:10px 12px;border-radius:var(--r-sm);background:rgba(20,2,8,.25);min-width:0}
.trio p{font-size:12.5px;color:rgba(243,233,211,.75);display:flex;align-items:center;gap:6px}
.trio strong{display:block;font-weight:600;font-size:16px;margin-top:1px;white-space:nowrap;overflow:hidden}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:currentColor}
.c-inc{color:var(--income)}.c-exp{color:var(--expense)}.c-sav{color:var(--saving)}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:22px 2px 30px}
.action{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 6px 16px;text-decoration:none;text-align:center;border-radius:22px;transition:transform .2s}
.action:nth-child(1){transform:rotate(-1.6deg)}.action:nth-child(2){transform:rotate(1deg)}.action:nth-child(3){transform:rotate(-.8deg)}
.action:hover,.action:focus-visible{transform:rotate(0) translateY(-2px)}
.action:active{transform:scale(.97)}
.action .ico{background:transparent}
.action span{font-size:14.5px;font-weight:600;line-height:1.25}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.sec-head h2{font-family:var(--serif);font-weight:400;font-size:26px;color:var(--cream)}
.sec-head a{font-size:14px;color:var(--ink-2);text-decoration:none}
.list{padding:6px 12px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:11px 4px;text-align:left;border-radius:14px}
.row+.row{border-top:1px solid var(--line)}
.row .mid{flex:1;min-width:0}
.row .t{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;font-weight:600;white-space:nowrap}
.row .amt small{display:block;font-size:12px;font-weight:400;color:var(--ink-3)}
.empty{padding:26px 18px;text-align:center;color:var(--ink-2)}
.empty .btn{margin-top:14px}

/* ---------- account ---------- */
.acct-card{padding:22px 20px;display:grid;gap:16px;margin-bottom:14px}
.acct-card h2{font-family:var(--serif);font-weight:400;font-size:24px;color:var(--cream);line-height:1.15}
.acct-card p{color:var(--ink-2);font-size:14.5px}
.who{display:flex;align-items:center;gap:14px}
.who strong{display:block;color:var(--ink);font-weight:600;font-size:16px}
.who span{display:block;color:var(--ink-2);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;background:var(--cream);color:var(--maroon-ink);display:grid;place-items:center;font-weight:600;font-size:20px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools .btn{min-height:44px;padding:0 18px;font-size:14.5px}
.acct-card.velvet{border-radius:var(--r-lg)}
.acct-card.velvet p{color:rgba(243,233,211,.8)}

/* ---------- sign-in ---------- */
body.is-login .nav{visibility:hidden}
body.is-login .piggy{opacity:0}
.login{text-align:center;padding-top:5vh;max-width:420px}
.login-pig{width:150px;height:auto;display:block;margin:0 auto 14px;animation:bob 5s ease-in-out infinite}
.login h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,8.6vw,40px);line-height:1.1;color:var(--cream)}
.login .muted{margin:10px auto 26px;max-width:330px}
.login-actions{display:grid;gap:10px}
.login .fine{margin-top:22px;font-size:13px;color:var(--ink-3)}

/* ---------- add flow ---------- */
.flow-head{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.back svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.flow-head h1{font-family:var(--serif);font-weight:400;font-size:clamp(32px,8.4vw,38px);line-height:1.05;color:var(--cream)}
.flow-head p{color:var(--ink-2);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:9px;padding:16px 6px 14px;border-radius:var(--r-md);text-align:center;background:var(--grain),var(--card);transition:transform .12s,background .2s;min-height:108px}
.tile:hover{background:var(--grain),var(--card-2)}
.tile:active{transform:scale(.96)}
.tile span{font-size:13.5px;line-height:1.25;font-weight:500}
.tile.new span{color:var(--ink-2)}
.tile.sel{box-shadow:inset 0 0 0 2px #E9B5B6}
.form{padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.catchip{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border-radius:var(--r-md);background:var(--card-2);text-align:left}
.catchip strong{font-weight:500}
.catchip .path{flex:1;min-width:0}
.catchip .path small{display:block;color:var(--ink-3);font-size:12.5px}
.catchip .change{font-size:13.5px;color:var(--ink-2);padding-right:8px}
.catchip:disabled .change{display:none}
.amount{display:flex;align-items:baseline;gap:6px;padding:4px 6px 8px;border-bottom:1.5px dashed rgba(213,196,161,.3)}
.amount:focus-within{border-bottom-color:rgba(233,181,182,.7)}
.amount .cur{font-family:var(--serif);font-size:32px;color:var(--ink-3)}
.amount input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;font-family:var(--serif);font-size:clamp(46px,13vw,58px);color:var(--cream)}
.amount input::placeholder{color:rgba(213,196,161,.28)}
.field{display:grid;gap:6px}
.field>span{font-size:13.5px;color:var(--ink-2);padding-left:4px}
.field input{width:100%;min-height:50px;padding:0 16px;border-radius:var(--r-sm);background:var(--field);border:1.5px solid transparent;outline:0;font-size:16px}
.field input:focus{border-color:rgba(233,181,182,.5)}
.field input::placeholder{color:var(--ink-3)}
.datebtn{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px;border-radius:var(--r-sm);background:var(--field);font-size:16px;text-align:left}
.datebtn svg{width:20px;height:20px;stroke:var(--ink-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.datebtn .hint{margin-left:auto;font-size:13px;color:var(--ink-3)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--field)}
.seg button{min-height:42px;padding:0 14px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--ink-2);transition:background .2s,color .2s}
.seg button[aria-checked=true],.seg button[aria-pressed=true]{background:var(--maroon-2);color:var(--cream)}
.note{font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;align-items:flex-start}
.err{color:var(--neg);font-size:14px}
.err:empty{display:none}
.addsub{justify-self:start;font-size:13.5px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding-left:4px}

/* done: a scalloped maroon stamp */
.done{text-align:center;padding-top:6vh}
.seal{width:104px;height:104px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;color:var(--cream);background:var(--grain),var(--velvet);box-shadow:0 0 0 5px var(--forest),0 0 0 6.5px rgba(233,181,182,.55);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.seal svg{width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.seal path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .2s ease forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.done h1{font-family:var(--serif);font-weight:400;font-size:clamp(40px,11vw,52px);line-height:1.05;color:var(--cream)}
.done p{color:var(--ink-2);margin-top:8px;font-size:16px}
.done-actions{display:grid;gap:10px;max-width:340px;margin:28px auto 0}
.done .after{margin-top:22px;font-size:14px;color:var(--ink-3)}

/* ---------- sheet / dialog (velvet) ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(12,18,13,.6);opacity:0;transition:opacity .25s}
.overlay.open{opacity:1}
.sheet{width:100%;max-width:500px;max-height:92dvh;overflow:auto;padding:24px 20px calc(20px + var(--safe-b));border-radius:30px 30px 0 0;background:var(--grain),var(--velvet);color:var(--cream);transform:translateY(30px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.overlay.open .sheet{transform:none}
@media (min-width:640px){.overlay{align-items:center}.sheet{border-radius:30px}}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1}
.sheet .body{color:rgba(243,233,211,.8);margin:8px 0 18px;font-size:15px}
.sheet .stack{display:grid;gap:10px}
.sheet .field{margin:14px 0}
.sheet .field>span{color:rgba(243,233,211,.75)}
.sheet .field input{background:rgba(20,2,8,.35)}
.sheet .btn.ghost{background:rgba(20,2,8,.3)}
.sheet .btn.primary{background:var(--cream);color:var(--maroon-ink)}
.sheet .btn.primary::after{border-color:rgba(92,27,40,.35)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 18px}
.icons button{display:grid;place-items:center;aspect-ratio:1;border-radius:14px;background:rgba(20,2,8,.3)}
.icons button svg{width:23px;height:23px;stroke:var(--cream);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icons button[aria-pressed=true]{background:var(--cream)}
.icons button[aria-pressed=true] svg{stroke:var(--maroon-ink)}
.quick{display:flex;gap:8px;margin:14px 0 6px}
.quick button{padding:7px 16px;border-radius:999px;font-size:14px;background:rgba(20,2,8,.3)}
.wheels{position:relative;display:grid;grid-template-columns:1fr 1.25fr 1.25fr;height:220px;margin:8px 0 6px;

const LS = 'moneyMinded.v1';

function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem(LS));
    if (s && Array.isArray(s.entries)) return {entries: s.entries, cats: {income: s.cats?.income || [], expense: s.cats?.expense || []}, subs: s.subs || {}};
  } catch (e) {}
  return blank();
}
function persist() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
const cats = t => BUILTIN[t].concat(S.cats[t] || []);
const catById = (t, id) => cats(t).find(c => c.id === id);
const subsOf = (t, id) => ((catById(t, id) || {}).subs || []).concat(S.subs[id] || []);
const catOf = e => e.type === 'save' ? SAVINGS_CAT : e.type === 'withdraw' ? WITHDRAW_CAT
  : (catById(e.type, e.cat) || {name: 'Other', icon: 'tag', c: 'clay'});
const subOf = e => e.sub ? subsOf(e.type, e.cat).find(s => s.id === e.sub) : null;
const fromSav = e => e.type === 'expense' ? Math.min(+e.amount || 0, +e.fromSavings || 0) : 0;

function upsert(e) {
  const i = S.entries.findIndex(x => x.id === e.id);
  if (i >= 0) S.entries[i] = e; else S.entries.push(e);
  persist(); Cloud.put(e);
}

/* ---------------- the money logic ----------------
   Spending money (this month) = income + taken from savings − expenses paid from income − moved to savings
   At the end of every month, whatever is left (or short) moves into savings automatically.
   Savings pot = added − taken out − expenses paid from savings + month-end leftovers.        */
const zeroM = () => ({inc: 0, wd: 0, expInc: 0, expSav: 0, save: 0, sweep: 0});
function ledger(entries = S.entries) {
  const cur = mkey(todayISO()), months = {};
  for (const e of entries) {
    const m = months[mkey(e.date)] ||= zeroM(); const a = +e.amount || 0;
    if (e.type === 'income') m.inc += a;
    else if (e.type === 'withdraw') m.wd += a;
    else if (e.type === 'save') m.save += a;
    else if (e.type === 'expense') { const fs = fromSav(e); m.expSav += fs; m.expInc += a - fs; }
  }
  const sweeps = []; let pot = 0;
  for (const k of Object.keys(months).sort()) {
    const m = months[k];
    pot += m.save - m.wd - m.expSav;
    if (k < cur) {
      const left = round2(m.inc + m.wd - m.expInc - m.save);
      m.sweep = left;
      if (left !== 0) { sweeps.push({month: k, amount: left}); pot += left; }
    }
  }
  const c = months[cur] || zeroM();
  return {months, sweeps, cur, pot: round2(pot), spend: round2(c.inc + c.wd - c.expInc - c.save), c};
}

/* Every open sheet pushes a history entry, so the browser/phone Back button closes the sheet
   and leaves you on the page you were on (e.g. the expense form) instead of jumping back a page. */
const sheets = []; let sheetSeq = 0;
window.addEventListener('popstate', () => { const top = sheets[sheets.length - 1]; if (top && (!history.state || history.state.sheet !== top.id)) top.dismiss(); });
function openSheet(html, {onClose, label = 'Dialog'} = {}) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
  document.body.appendChild(ov);
  const prev = document.activeElement;
  requestAnimationFrame(() => ov.classList.add('open'));
  const id = ++sheetSeq, rec = {id};
  let pushed = false;
  try { history.pushState({sheet: id}, ''); pushed = true; } catch (e) {}
  sheets.push(rec);
  let closed = false;
  const dismiss = () => { if (closed) return; closed = true; const i = sheets.indexOf(rec); if (i >= 0) sheets.splice(i, 1); ov.classList.remove('open'); document.removeEventListener('keydown', onKey); setTimeout(() => ov.remove(), 260); onClose && onClose(); prev && prev.focus && prev.focus({preventScroll: true}); };
  rec.dismiss = dismiss;
  /* closing from inside the sheet pops our history entry first; the popstate then dismisses it */
  const close = () => { if (closed) return; if (pushed && history.state && history.state.sheet === id) history.back(); else dismiss(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  return {el: ov.firstElementChild, close};
}
function ask({title, body = '', actions}) {
  return new Promise(res => {
    let val = null;
    const sh = openSheet(`<h3>${esc(title)}</h3>${body ? `<p class="body">${body}</p>` : '<div style="height:16px"></div>'}<div class="stack">${actions.map((a, i) =>
      `<button class="btn ${a.style || 'ghost'} block" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>`, {onClose: () => res(val), label: title});
    sh.el.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) { val = actions[+b.dataset.i].value; sh.close(); } });
    setTimeout(() => sh.el.querySelector('[data-i]')?.focus(), 60);
  });
}

function fitText(root = view) {
  root.querySelectorAll('.fit').forEach(el => {
    el.style.fontSize = '';
    let size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
    while (el.scrollWidth > el.clientWidth + 1 && size > 11 && guard++ < 30) { size -= 1; el.style.fontSize = size + 'px'; }
  });
}

  if (Cloud.status === 'ready') return true;

/* ---------------- router ---------------- */
let current = '', previous = '';
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) { document.body.classList.add('is-landing'); document.body.classList.remove('app'); current = ''; return; }
  document.body.classList.remove('is-landing'); document.body.classList.add('app');
  const i = h.indexOf('-'), name = i < 0 ? h : h.slice(0, i), a = i < 0 ? '' : h.slice(i + 1);
  if (name !== 'login' && needsLogin()) { location.replace('#login'); return; }
  if (name === 'login' && Cloud.user) { location.replace('#home'); return; }
  document.body.classList.toggle('is-login', name === 'login');
  document.body.classList.toggle('is-wide', name === 'logs' || name === 'reports');
  previous = current; current = h;
  $$('[data-nav]').forEach(n => n.toggleAttribute('aria-current', false));
  const nav = $(`[data-nav="${name}"]`); if (nav) nav.setAttribute('aria-current', 'page');
  closeTip();
  if (name === 'logs') renderLogs();
  else if (name === 'reports') renderReports();
  else if (name === 'add') startFlow(a === 'income' || a === 'save' ? a : 'expense');
  else if (name === 'edit') startEdit(a);
  else if (name === 'login') renderLogin();
  else if (name === 'account') renderAccount();
  else renderHome();
  fitText();
  view.classList.remove('view-in'); void view.offsetWidth; view.classList.add('view-in');
  window.scrollTo({top: 0, behavior: 'instant'});
}
window.addEventListener('hashchange', route);

function exportBackup() {
  const blob = new Blob([JSON.stringify({app: 'money-minded', version: 1, exportedAt: new Date().toISOString(), ...S}, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `money-minded-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);

function importBackup() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch (e) { toast("That file isn't a Money Minded backup"); return; }
    if (!data || !Array.isArray(data.entries)) { toast("That file isn't a Money Minded backup"); return; }
    const valid = data.entries.filter(e => e && e.id && e.date && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && ['income','expense','save','withdraw'].includes(e.type) && +e.amount > 0);
    const ok = await ask({title: 'Restore backup?', body: `This adds ${valid.length} entr${valid.length === 1 ? 'y' : 'ies'} from the file. Entries you already have stay as they are, and matching ones are replaced by the backup copy.`, actions: [{label: 'Restore', value: 1, style: 'primary'}, {label: 'Cancel', value: 0}]});
    if (!ok) return;
    const byId = new Map(S.entries.map(e => [e.id, e]));
    valid.forEach(e => byId.set(e.id, clean(e)));
    S.entries = [...byId.values()];
    for (const t of ['income', 'expense']) for (const c of (data.cats?.[t] || [])) if (c && c.id && !catById(t, c.id)) S.cats[t].push(c);
    for (const [k, list] of Object.entries(data.subs || {})) { S.subs[k] ||= []; for (const s of list) if (s && s.id && !S.subs[k].some(x => x.id === s.id)) S.subs[k].push(s); }
    persist(); Cloud.putMeta(); Cloud.putMany(valid.map(clean));
    toast(`Restored ${valid.length} entries`); route();
  };
  inp.click();
}

/* Checks a draft against what's actually available and asks before anything goes below zero. */
async function checkMoney(d) {
  const L = ledger(S.entries.filter(x => x.id !== d.id));
  const isCur = mkey(d.date) === L.cur, a = d.amount;
  if (d.type === 'expense' && d.fromSavings === 0 && isCur && a > L.spend) {
    const avail = Math.max(0, L.spend), rest = round2(a - avail);
    const short = L.pot < rest ? ` Savings only has ${fmt(L.pot)}, so it would drop below zero.` : '';
    const v = await ask({title: 'Not enough left to spend',
      body: (avail > 0 ? `You have ${fmt(avail)} left to spend this month. Take the remaining ${fmt(rest)} from savings?` : `You have nothing left to spend this month. Take ${fmt(a)} from savings?`) + short,
      actions: [{label: avail > 0 ? `Take ${fmt(rest)} from savings` : `Pay ${fmt(a)} from savings`, value: 'savings', style: 'primary'}, {label: 'Add it anyway', value: 'anyway'}, {label: 'Cancel', value: null}]});
    if (!v) return null;

  }
  if (d.type === 'expense' && d.fromSavings > 0 && d.fromSavings > L.pot) {
    const v = await ask({title: 'Savings will go below zero', body: `You have ${fmt(L.pot)} in savings. Paying ${fmt(d.fromSavings)} from savings leaves you at ${fmt(L.pot - d.fromSavings)}.`,
      actions: [{label: 'Add it anyway', value: 1, style: 'primary'}, {label: 'Cancel', value: 0}]});

  }

}

/* ---------------- rolling date wheel ---------------- */
function makeWheel(el, onSettle) {
  const H = 40; let items = [], t, raf;
  const paint = () => { const st = el.scrollTop; items.forEach((it, i) => { const d = (i * H - st) / H, ad = Math.min(Math.abs(d), 3); it.style.transform = `rotateX(${(-d * 22).toFixed(1)}deg)`; it.style.opacity = (1 - ad * .3).toFixed(2); }); };
  const idx = () => Math.max(0, Math.min(items.length - 1, Math.round(el.scrollTop / H)));
  el.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); clearTimeout(t); t = setTimeout(() => onSettle(idx()), 110); }, {passive: true});
  el.addEventListener('click', e => { const it = e.target.closest('.witem'); if (it) el.scrollTo({top: +it.dataset.i * H, behavior: 'smooth'}); });
  el.addEventListener('keydown', e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const i = Math.max(0, Math.min(items.length - 1, idx() + (e.key === 'ArrowDown' ? 1 : -1))); el.scrollTo({top: i * H, behavior: 'smooth'}); } });
  return {
    set(list, i) { el.innerHTML = '<div class="wpad"></div>' + list.map((x, j) => `<div class="witem" data-i="${j}">${x}</div>`).join('') + '<div class="wpad"></div>'; items = $$('.witem', el); el.scrollTop = i * H; paint(); },
    go(i, smooth = true) { if (idx() !== i || Math.abs(el.scrollTop - i * H) > 1) el.scrollTo({top: i * H, behavior: smooth ? 'smooth' : 'auto'}); },
    get n() { return items.length; }
  };
}
function openDateSheet(value, onPick) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const tY = today.getFullYear(), years = []; for (let y = tY - 10; y <= tY; y++) years.push(y);
  let d0 = parseISO(value), D = d0.getDate(), M = d0.getMonth(), Y = d0.getFullYear();
  const sh = openSheet(`<h3>Pick a date</h3>
    <div class="quick"><button data-q="0">Today</button><button data-q="1">Yesterday</button></div>
    <div class="wheels"><div class="band"></div>
      <div class="wheel" id="wD" tabindex="0" aria-label="Day"></div><div class="wheel" id="wM" tabindex="0" aria-label="Month"></div><div class="wheel" id="wY" tabindex="0" aria-label="Year"></div></div>
    <p class="wheel-read" id="wRead" aria-live="polite"></p>
    <button class="btn primary block" data-done>Use this date</button>`, {label: 'Pick a date'});
  const el = sh.el;
  const read = () => { $('#wRead', el).textContent = `${DAYS[new Date(Y, M, D).getDay()]}, ${D} ${MONTHS[M]} ${Y}`; };
  const wd = makeWheel($('#wD', el), i => { D = i + 1; settle(); });
  const wm = makeWheel($('#wM', el), i => { M = i; settle(); });
  const wy = makeWheel($('#wY', el), i => { Y = years[i]; settle(); });
  /* months after this one (in the current year) and days after today (in the current month) are never shown */
  const maxM = () => Y === tY ? today.getMonth() : 11;
  const maxD = () => Y === tY && M === today.getMonth() ? today.getDate() : dim(Y, M);
  function settle() {
    if (M > maxM()) M = maxM();
    const nm = maxM() + 1;
    if (wm.n !== nm) wm.set(MON.slice(0, nm), M); else wm.go(M);
    const n = maxD();
    if (D > n) D = n;
    if (wd.n !== n) wd.set(Array.from({length: n}, (_, i) => i + 1), D - 1); else wd.go(D - 1);
    read();
  }
  requestAnimationFrame(() => {
    wd.set(Array.from({length: maxD()}, (_, i) => i + 1), D - 1);
    wm.set(MON.slice(0, maxM() + 1), M); wy.set(years, years.indexOf(Y)); read();
  });
  el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    const t = new Date(today); t.setDate(t.getDate() - +b.dataset.q); D = t.getDate(); M = t.getMonth(); Y = t.getFullYear();
    wy.go(years.indexOf(Y)); wm.set(MON.slice(0, maxM() + 1), M); wd.set(Array.from({length: maxD()}, (_, i) => i + 1), D - 1); read();
  });
  $('[data-done]', el).onclick = () => { const n = dim(Y, M); onPick(iso(new Date(Y, M, Math.min(D, n)))); sh.close(); };
}

  all.forEach(w => {

  let rows, title, sub, total;
  if (!cat) {
    rows = groupTotals(exp, e => catById('expense', e.cat) ? e.cat : '__other').map(r => ({...r, name: catById('expense', r.k)?.name || 'Other', drill: true}));
    title = 'Where it went'; sub = 'Tap a slice to see inside it'; total = spent;
  } else {
    const c = catById('expense', cat) || {name: 'Other'}; const list = exp.filter(e => (catById('expense', e.cat) ? e.cat : '__other') === cat);
    const subs = subsOf('expense', cat);
    if (subs.length) rows = groupTotals(list, e => e.sub && subs.find(s => s.id === e.sub) ? e.sub : '').map(r => ({...r, name: subs.find(s => s.id === r.k)?.name || 'Other ' + c.name.toLowerCase()}));
    else rows = groupTotals(list, e => (e.label || 'No label').trim()).map(r => ({...r, name: r.k}));
    title = c.name; sub = subs.length ? 'Split by subcategory' : 'Split by your labels'; total = sum(list);
  }
  // top five keep their own colour, the rest fold into "Other"
  let slices = rows.slice(0, 5).map((r, i) => ({...r, color: SERIES[i]}));
  if (rows.length > 5) { const rest = rows.slice(5); slices.push({k: '__rest', name: `Other (${rest.length})`, v: round2(sum(rest, r => r.v)), color: OTHER, drill: false, rest}); }
  const R = 108, r0 = 70, cx = 110, cy = 110; let a = 0;
  const paths = slices.map((s, i) => {
    const f = s.v / total, a0 = a, a1 = a + f * Math.PI * 2; a = a1;
    const d = f >= .9999 ? ring(cx, cy, r0, R) : sector(cx, cy, r0, R, a0, a1);
    return `<path d="${d}" fill="${s.color}" stroke="#263528" stroke-width="2.5" data-i="${i}" ${s.drill ? 'role="button" tabindex="0"' : ''} aria-label="${esc(s.name)} ${fmt(s.v)}"></path>`;
  }).join('');
  host.innerHTML = `<div class="panel-top"><div><h2>${esc(title)}</h2><p class="sub">${sub}</p></div>${cat ? `<button class="linkbtn" data-up>${svg('back')}All categories</button>` : ''}</div>
    <div class="donut-wrap"><div class="donut"><svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="Pie chart of spending">${paths}</svg>
      <div class="ctr"><strong class="num">${fmtShort(total)}</strong><span>${cat ? esc(title) : 'spent in ' + repState.year}</span></div><div class="tip" id="ptip"></div></div>
    <div class="legend">${slices.map((s, i) => `<button data-i="${i}" ${s.drill ? '' : 'disabled'}><span class="sw" style="background:${s.color}"></span><span class="nm">${esc(s.name)}</span><span class="num">${fmt(s.v)}</span><span class="pct num">${Math.round(s.v / total * 100)}%</span></button>`).join('')}</div></div>`;
  const tip = $('#ptip', host);
  const show = (i, ev) => { const s = slices[i]; tip.innerHTML = `<b>${esc(s.name)}</b><div><span>Spent</span><span>${fmt(s.v)}</span></div><div><span>Share</span><span>${(s.v / total * 100).toFixed(1)}%</span></div>${s.drill ? '<div style="opacity:.7;margin-top:4px">Tap to open</div>' : ''}`;
    const box = host.querySelector('.donut').getBoundingClientRect(); const x = ev ? ev.clientX - box.left : 110, yy = ev ? ev.clientY - box.top : 110;
    tip.style.left = Math.min(Math.max(x - 75, -20), 90) + 'px'; tip.style.top = (yy - 96) + 'px'; tip.classList.add('show');
    host.querySelectorAll('.legend button').forEach((b, j) => b.classList.toggle('hl', j === i));
    host.querySelectorAll('.donut path').forEach((p, j) => p.style.opacity = j === i ? 1 : .55); };
  const hide = () => { tip.classList.remove('show'); host.querySelectorAll('.donut path').forEach(p => p.style.opacity = 1); host.querySelectorAll('.legend button').forEach(b => b.classList.remove('hl')); };
  const drill = i => { const s = slices[i]; if (!s.drill) return; repState.cat = s.k; drawPie(exp, spent); };
  host.querySelectorAll('.donut path').forEach(p => {
    const i = +p.dataset.i;
    p.addEventListener('pointermove', ev => show(i, ev)); p.addEventListener('pointerleave', hide);
    p.addEventListener('click', () => drill(i)); p.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); drill(i); } });
    p.addEventListener('focus', () => show(i)); p.addEventListener('blur', hide);
  });
  host.querySelectorAll('.legend button').forEach(b => { const i = +b.dataset.i; b.onclick = () => drill(i); b.onmouseenter = () => show(i); b.onmouseleave = hide; });
  const up = host.querySelector('[data-up]'); if (up) up.onclick = () => { repState.cat = null; drawPie(exp, spent); };
}
function sector(cx, cy, r0, r1, a0, a1) {
  const p = (r, a) => `${(cx + r * Math.sin(a)).toFixed(2)} ${(cy - r * Math.cos(a)).toFixed(2)}`, L = a1 - a0 > Math.PI ? 1 : 0;
  return `M${p(r1, a0)}A${r1} ${r1} 0 ${L} 1 ${p(r1, a1)}L${p(r0, a1)}A${r0} ${r0} 0 ${L} 0 ${p(r0, a0)}Z`;
}
const ring = (cx, cy, r0, r1) => `M${cx} ${cy - r1}A${r1} ${r1} 0 1 1 ${cx} ${cy + r1}A${r1} ${r1} 0 1 1 ${cx} ${cy - r1}ZM${cx} ${cy - r0}A${r0} ${r0} 0 1 0 ${cx} ${cy + r0}A${r0} ${r0} 0 1 0 ${cx} ${cy - r0}Z`;
function niceMax(v) { if (v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
function drawBars(E, y) {
  const now = new Date(), host = $('#bars');
  const m = Array.from({length: 12}, () => ({spent: 0, earned: 0, saved: 0}));
  for (const e of E) { const i = +e.date.slice(5, 7) - 1, a = +e.amount || 0;
    if (e.type === 'expense') m[i].spent += a; else if (e.type === 'income') m[i].earned += a; else if (e.type === 'save') m[i].saved += a; else if (e.type === 'withdraw') m[i].saved -= a; }
  const max = niceMax(Math.max(...m.map(x => x.spent)));
  const future = i => y === now.getFullYear() && i > now.getMonth();
  host.innerHTML = `<div class="bars"><div class="gl" style="top:0"><span>${fmtShort(max)}</span></div><div class="gl" style="top:50%"><span>${fmtShort(max / 2)}</span></div><div class="gl" style="top:100%"><span>₹0</span></div>
    <div class="cols12">${m.map((x, i) => `<div class="bc ${future(i) ? 'future' : ''}" data-i="${i}" tabindex="0" role="button" aria-label="${MONTHS[i]}: spent ${fmt(x.spent)}"><div class="bar" style="height:${(x.spent / max * 100).toFixed(2)}%"></div></div>`).join('')}</div>
    <div class="tip" id="btip"></div></div><div class="mlabels">${MON.map(s => `<span>${s[0]}<span class="mfull">${s.slice(1)}</span></span>`).join('')}</div>`;
  const tip = $('#btip', host), wrap = host.querySelector('.bars');
  const show = i => { const x = m[i]; tip.innerHTML = `<b>${MONTHS[i]} ${y}</b><div><span>Spent</span><span>${fmt(x.spent)}</span></div><div><span>Earned</span><span>${fmt(x.earned)}</span></div><div><span>Saved</span><span>${fmt(x.saved)}</span></div>`;
    const bc = wrap.querySelectorAll('.bc')[i], left = bc.offsetLeft + bc.offsetWidth / 2, w = wrap.offsetWidth;
    tip.style.left = Math.max(-40, Math.min(w - 120, left - 80)) + 'px'; tip.style.top = '-12px'; tip.classList.add('show');
    wrap.classList.add('dim'); wrap.querySelectorAll('.bc').forEach((b, j) => b.classList.toggle('on', j === i)); };
  const hide = () => { tip.classList.remove('show'); wrap.classList.remove('dim'); wrap.querySelectorAll('.bc').forEach(b => b.classList.remove('on')); };
  wrap.querySelectorAll('.bc').forEach(b => { const i = +b.dataset.i;
    b.addEventListener('pointerenter', () => show(i)); b.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hide(); });
    b.addEventListener('click', () => show(i)); b.addEventListener('focus', () => show(i)); b.addEventListener('blur', hide); });
}
function closeTip() { $$('.tip.show').forEach(t => t.classList.remove('show')); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.bc,.donut,.legend')) { const w = $('.bars.dim'); if (w) { w.classList.remove('dim'); w.querySelectorAll('.bc').forEach(b => b.classList.remove('on')); } closeTip(); } });

/* ---------------- Google sign-in + sync (Firebase) ---------------- */
const Cloud = {
  status: FIREBASE_CONFIG ? 'loading' : 'off', user: null, m: null, db: null, auth: null, unsub: [],
  async init() {
    if (!FIREBASE_CONFIG) return;
    const base = 'https://www.gstatic.com/firebasejs/10.12.2/';
    try {
      const [appM, authM, fsM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      this.m = {...authM, ...fsM};
      const app = appM.initializeApp(FIREBASE_CONFIG);
      this.auth = authM.getAuth(app);
      try { this.db = fsM.initializeFirestore(app, {localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})}); }
      catch (e) { this.db = fsM.getFirestore(app); }
      authM.getRedirectResult(this.auth).catch(() => {});
      authM.onAuthStateChanged(this.auth, u => this.onUser(u));
    } catch (e) { console.warn('Firebase failed to load', e); this.status = 'error'; if (current === 'login') location.replace('#home'); else refresh(); }
  },
  async signIn() {
    if (!FIREBASE_CONFIG) { toast("Google sign-in isn't set up yet. See the README."); return; }
    if (!this.auth) { toast("Still connecting to Google. Try again in a moment."); return; }
    const p = new this.m.GoogleAuthProvider(); p.setCustomParameters({prompt: 'select_account'});
    try { await this.m.signInWithPopup(this.auth, p); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/web-storage-unsupported'].includes(e.code)) await this.m.signInWithRedirect(this.auth, p);
      else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') toast(e.code === 'auth/unauthorized-domain' ? 'Add this site to Authorized domains in Firebase' : "Couldn't sign in. Try again.");
    }
  },
  async signOut() { await this.m.signOut(this.auth); S = blank(); persist(); store(sessionStorage, SKIP_KEY, null); toast('Signed out'); location.hash = 'login'; },
  onUser(u) {
    this.unsub.forEach(f => f()); this.unsub = [];
    this.user = u; this.status = 'ready';
    store(localStorage, WAS_KEY, u ? '1' : null);
    if (u && current === 'login') location.replace('#home');
    if (!u) { refresh(); return; }
    const {collection, doc, onSnapshot} = this.m;
    let first = true;
    this.unsub.push(onSnapshot(collection(this.db, 'users', u.uid, 'entries'), snap => {
      const remote = snap.docs.map(d => d.data());
      if (first) {
        first = false;
        const ids = new Set(remote.map(e => e.id));
        const localOnly = S.entries.filter(e => !ids.has(e.id));
        if (localOnly.length) { this.putMany(localOnly); toast(`Synced ${localOnly.length} entr${localOnly.length === 1 ? 'y' : 'ies'} from this device`); }
        S.entries = remote.concat(localOnly);
      } else S.entries = remote;
      persist(); refresh();
    }, err => { console.warn(err); this.status = 'error'; refresh(); }));
    let firstMeta = true;
    this.unsub.push(onSnapshot(doc(this.db, 'users', u.uid, 'meta', 'config'), snap => {
      const r = snap.exists() ? snap.data() : {};
      const merged = {income: [], expense: []}, subs = {};
      for (const t of ['income', 'expense']) { const seen = new Set(); for (const c of [...(r.cats?.[t] || []), ...(firstMeta ? S.cats[t] : [])]) if (!seen.has(c.id)) { seen.add(c.id); merged[t].push(c); } }
      for (const src of [r.subs || {}, firstMeta ? S.subs : {}]) for (const [k, list] of Object.entries(src)) { subs[k] ||= []; for (const s of list) if (!subs[k].some(x => x.id === s.id)) subs[k].push(s); }
      const changed = firstMeta && JSON.stringify({cats: merged, subs}) !== JSON.stringify({cats: r.cats || {}, subs: r.subs || {}});
      S.cats = merged; S.subs = subs; firstMeta = false; persist();
      if (changed) this.putMeta();
      refresh();
    }));
    refresh();
  },
  put(e) { if (!this.user) return; const {doc, setDoc} = this.m; setDoc(doc(this.db, 'users', this.user.uid, 'entries', e.id), clean(e)).catch(err => { console.warn(err); toast("Couldn't sync. Saved on this device."); }); },
  putMany(list) { if (!this.user || !list.length) return; const {doc, writeBatch} = this.m;
    for (let i = 0; i < list.length; i += 400) { const b = writeBatch(this.db); list.slice(i, i + 400).forEach(e => b.set(doc(this.db, 'users', this.user.uid, 'entries', e.id), clean(e))); b.commit().catch(err => console.warn(err)); } },
  del(id) { if (!this.user) return; const {doc, deleteDoc} = this.m; deleteDoc(doc(this.db, 'users', this.user.uid, 'entries', id)).catch(err => console.warn(err)); },
  putMeta() { if (!this.user) return; const {doc, setDoc} = this.m; setDoc(doc(this.db, 'users', this.user.uid, 'meta', 'config'), {cats: S.cats, subs: S.subs}).catch(err => console.warn(err)); }
};

/* ---------------- boot ---------------- */
let lastDay = todayISO();
setInterval(() => { if (todayISO() !== lastDay) { lastDay = todayISO(); refresh(); } }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && todayISO() !== lastDay) { lastDay = todayISO(); refresh(); } });
route();
Cloud.init();
</script>
